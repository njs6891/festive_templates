<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Festive Headers – Christmas &amp; Diwali</title>
<style>
/* ===== Shared header CSS ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:#0b0f1f;color:#fff;font-family:Georgia,"Times New Roman",serif}
img{display:block;-webkit-user-drag:none;user-select:none}
.label{margin:18px 16px 8px;font:600 13px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.fest-header{position:relative;height:clamp(190px,28vw,280px);overflow:hidden;isolation:isolate}
.fest-header .bar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px clamp(12px,3vw,32px);background:linear-gradient(180deg,rgba(0,0,0,.45),transparent)}
.fest-header .brand{font-size:clamp(16px,2.2vw,22px);font-weight:700;letter-spacing:.04em}
.fest-header nav{display:flex;gap:clamp(10px,2.2vw,26px);font:500 clamp(12px,1.5vw,15px)/1 system-ui,sans-serif}
.fest-header nav a{color:#fff;text-decoration:none;opacity:.85}
.fest-header nav a:hover{opacity:1}
.fest-header .greet{position:absolute;z-index:4;left:0;right:0;bottom:14%;text-align:center;pointer-events:none;padding:0 12px}
.fest-header h2{margin:0;font-size:clamp(24px,5vw,54px);letter-spacing:.03em}
.fest-header .greet p{margin:.2em 0 0;font-size:clamp(13px,1.8vw,20px);opacity:.9}
@media (max-width:520px){.fest-header nav a:nth-child(n+3){display:none}}

/* ===== Christmas header ===== */
.hdr-xmas{background:radial-gradient(ellipse at 85% 10%,rgba(255,240,200,.18),transparent 35%),
  linear-gradient(180deg,#050b24,#0e1f4d 65%,#2a3b78)}
.hdr-xmas h2{text-shadow:0 0 22px rgba(255,214,140,.65)}
.hdr-xmas .star{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#fff;
  opacity:.3;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes tw{50%{opacity:1;transform:scale(1.4)}}
.hdr-xmas .flake{position:absolute;top:-8px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#fff;
  opacity:var(--o);animation:fall var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--dr),320px)}}
.hdr-xmas .fly{position:absolute;z-index:2;top:34%;left:0;width:clamp(220px,34vw,470px);animation:fly 20s linear infinite;will-change:transform}
.hdr-xmas .bob{animation:bob 1.6s ease-in-out infinite}
.hdr-xmas .bob img{width:100%;height:auto;filter:drop-shadow(0 0 12px rgba(255,214,140,.4)) drop-shadow(0 8px 14px rgba(0,0,0,.4))}
@keyframes fly{0%{transform:translate(-100%,20px) rotate(-2deg)}50%{transform:translate(calc(50vw - 50%),-14px)}100%{transform:translate(100vw,16px) rotate(2deg)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-.8deg)}}
.hdr-xmas .hills{position:absolute;z-index:3;left:0;right:0;bottom:0;height:16%;
  background:radial-gradient(120% 100% at 20% 100%,#eef3ff 0 55%,transparent 56%),radial-gradient(120% 100% at 85% 110%,#dfe8ff 0 55%,transparent 56%)}

.hdr-diwali::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(5,10,38,.55),transparent 55%)}
.hdr-diwali h2{background:linear-gradient(180deg,#fff3c4,#ffb73a);-webkit-background-clip:text;background-clip:text;color:transparent;

.hdr-diwali .diya.d1{left:12%}.hdr-diwali .diya.d2{right:12%;transform:scaleX(-1)}
.hdr-diwali .diya img{width:100%;height:auto}
.hdr-diwali .fg{position:absolute;left:var(--x);top:var(--y);width:34%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,90,.55),rgba(255,140,40,.18) 45%,transparent 68%);
  mix-blend-mode:screen;animation:fl var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes fl{0%,100%{opacity:.9;scale:1}20%{opacity:.55;scale:.9}45%{opacity:1;scale:1.1}70%{opacity:.65;scale:.95}}

@media (prefers-reduced-motion:reduce){
  .hdr-xmas .fly{animation:none;left:50%;transform:translateX(-50%)}
  .hdr-xmas .bob,.hdr-xmas .star,.hdr-xmas .flake,.hdr-diwali .lantern,.hdr-diwali .fg{animation:none}
  .hdr-diwali canvas{display:none}
}

<script>
(function(){
  var r=Math.random,hx=document.getElementById('hx'),f=document.createDocumentFragment();
  function mk(c,css){var d=document.createElement('i');d.className=c;d.style.cssText=css;f.appendChild(d)}
  for(var i=0;i<40;i++)mk('star','--x:'+r()*100+'%;--y:'+r()*55+'%;--s:'+(1+r()*2)+'px;--d:'+(2+r()*3)+'s;--dl:-'+r()*5+'s');
  for(var j=0;j<40;j++)mk('flake','--x:'+r()*100+'%;--s:'+(2+r()*4)+'px;--o:'+(.4+r()*.6)+';--d:'+(5+r()*6)+'s;--dl:-'+r()*11+'s;--dr:'+(r()*60-30)+'px');
  hx.insertBefore(f,hx.firstChild);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=document.getElementById('fw'),ctx=cv.getContext('2d'),W,H,P=[],hues=[45,35,25,330,15,50,140];
  function size(){var d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  function burst(){var x=W*(.12+r()*.76),y=H*(.12+r()*.4),h=hues[r()*hues.length|0],n=45+(r()*30|0);
    for(var i=0;i<n;i++){var a=6.283*i/n,s=1+r()*2.2;P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,dc:.01+r()*.012,h:h+r()*25})}}
  var nx=0;
  function tick(t){
    if(!document.hidden){
      if(t>nx){burst();nx=t+700+r()*1200}
      ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      for(var i=P.length-1;i>=0;i--){var p=P[i];p.vx*=.985;p.vy=p.vy*.985+.03;p.x+=p.vx;p.y+=p.vy;p.l-=p.dc;
        if(p.l<=0){P.splice(i,1);continue}
        ctx.fillStyle='hsla('+p.h+',100%,62%,'+p.l+')';ctx.beginPath();ctx.arc(p.x,p.y,1.5,0,6.283);ctx.fill()}
    }
    requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
})();
