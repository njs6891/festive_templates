.fireworks{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;pointer-events:none}

/* swaying lanterns */
.lantern{position:absolute;top:0;width:clamp(80px,15vw,220px);transform-origin:50% 0;
  animation:sway var(--swing-time) ease-in-out infinite alternate;will-change:transform}
.lantern img{width:100%;height:auto;animation:lit 2.4s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 22px rgba(var(--ember),.65))}
.lantern.l1{left:6%}
.lantern.l2{right:7%;width:clamp(60px,11vw,160px);animation-duration:calc(var(--swing-time)*1.3);animation-delay:-1.7s}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes lit{from{filter:drop-shadow(0 0 14px rgba(var(--ember),.45)) brightness(.94)}
               to{filter:drop-shadow(0 0 30px rgba(var(--ember),.85)) brightness(1.08)}}

/* rangoli "floor" – tilted and slowly spinning */
.floor{position:absolute;left:50%;bottom:2vh;transform:translateX(-50%);
  width:clamp(260px,42vw,600px);aspect-ratio:1/.5;perspective:900px}
.floor::before{content:"";position:absolute;inset:8% 4%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(var(--gold),.45),transparent);animation:pulse 3s ease-in-out infinite alternate}
.floor img{position:absolute;left:0;top:50%;width:100%;height:auto;
  transform:translateY(-50%) rotateX(62deg);animation:spin var(--spin-time) linear infinite}
@keyframes spin{to{transform:translateY(-50%) rotateX(62deg) rotateZ(360deg)}}
@keyframes pulse{to{opacity:.55;transform:scale(1.06)}}

/* diyas with flickering flames */
.diya{position:absolute;bottom:1.5vh;width:clamp(150px,27vw,400px)}
.diya.left{left:2%}
.diya.right{right:2%;transform:scaleX(-1)}
.diya img{width:100%;height:auto;animation:warm 2s ease-in-out infinite alternate}
.fg{position:absolute;left:var(--x);top:var(--y);width:34%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,90,.55),rgba(255,140,40,.18) 45%,transparent 68%);
  mix-blend-mode:screen;animation:flicker var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes flicker{0%,100%{opacity:.9;scale:1}20%{opacity:.55;scale:.9}45%{opacity:1;scale:1.1}70%{opacity:.65;scale:.95}}
@keyframes warm{to{filter:brightness(1.07) saturate(1.1)}}

/* rising embers */
.ember{position:absolute;bottom:-10px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
  background:rgb(var(--gold));box-shadow:0 0 8px 2px rgba(var(--ember),.8);opacity:0;
  animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes rise{10%{opacity:1}100%{opacity:0;transform:translate(var(--drift),-80vh)}}

@media (prefers-reduced-motion:reduce){
  .lantern,.lantern img,.floor img,.floor::before,.diya img,.fg,.ember{animation:none}
  .fireworks,.ember{display:none}
}
/* ===== end of Diwali CSS ===== */

.hero{position:absolute;left:0;right:0;top:11%;text-align:center;padding:0 16px;pointer-events:none}

<script>
(function(){
  var scene=document.getElementById('scene'),r=Math.random;
  var f=document.createDocumentFragment();
  for(var i=0;i<40;i++){var e=document.createElement('i');e.className='ember';
    e.style.cssText='--x:'+r()*100+'%;--s:'+(2+r()*3)+'px;--d:'+(6+r()*7)+'s;--dl:-'+r()*12+'s;--drift:'+(r()*120-60)+'px';f.appendChild(e)}
  scene.appendChild(f);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=document.getElementById('fw'),ctx=cv.getContext('2d'),W,H,P=[],hues=[45,35,25,330,15,50,140];
  function size(){var d=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  function burst(){
    var x=W*(.15+r()*.7),y=H*(.1+r()*.35),h=hues[r()*hues.length|0],n=60+(r()*40|0);
    for(var i=0;i<n;i++){var a=Math.PI*2*i/n,s=1.5+r()*3;
      P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,dc:.008+r()*.012,h:h+r()*25})}
  }
  var next=0;
  function tick(t){
    if(!document.hidden){
      if(t>next){burst();next=t+600+r()*1100}
      ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      for(var i=P.length-1;i>=0;i--){var p=P[i];
        p.vx*=.985;p.vy=p.vy*.985+.035;p.x+=p.vx;p.y+=p.vy;p.l-=p.dc;
        if(p.l<=0){P.splice(i,1);continue}
        ctx.fillStyle='hsla('+p.h+',100%,62%,'+p.l+')';ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,6.283);ctx.fill()}
    }
    requestAnimationFrame(tick)
  }
  requestAnimationFrame(tick);
})();
</script>
