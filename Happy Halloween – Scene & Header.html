<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Happy Halloween – Scene &amp; Header</title>
<style>
/* ===== Halloween CSS (copy this block into your app) ===== */
:root{
  --sky-top:#09041a; --sky-mid:#2a0f47; --sky-low:#7a2a3a; --glow:255,140,40;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{margin:0}
body{background:#07030f;color:#fff;font-family:Georgia,"Times New Roman",serif}
img{display:block;-webkit-user-drag:none;user-select:none}
.label{margin:18px 16px 8px;font:600 13px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.6}

.hw{position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse at 82% 18%,rgba(255,225,170,.22),transparent 32%),
             linear-gradient(180deg,var(--sky-top),var(--sky-mid) 62%,var(--sky-low))}
.hw-full{height:100svh;min-height:540px}
.hw-head{height:clamp(200px,30vw,300px)}
.hw .star{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.3;
  animation:tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes tw{50%{opacity:1;transform:scale(1.4)}}
.hw .moon{position:absolute;right:9%;top:9%;width:clamp(56px,10vw,130px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe8,#f3dfa0 70%);box-shadow:0 0 70px rgba(255,225,150,.55)}
.hw-head .moon{top:16%;width:clamp(44px,7vw,90px)}

/* lightning (soft, rare) */
.hw::after{content:"";position:absolute;inset:0;z-index:6;background:rgba(190,170,255,.18);opacity:0;pointer-events:none;animation:zap 11s linear infinite}
@keyframes zap{0%,90%,94%,100%{opacity:0}91%{opacity:1}92.5%{opacity:.1}93%{opacity:.8}}

/* witches: outer = path, inner = bob */
.witch{position:absolute;left:0;z-index:3;will-change:transform}
.witch .bob{animation:bob 2.2s ease-in-out infinite}
.witch img{width:100%;height:auto;filter:drop-shadow(0 0 16px rgba(170,90,255,.4)) drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.hw-full .w1{top:10%;width:clamp(240px,34vw,520px);animation:fly 24s linear infinite}
.hw-full .w2{top:34%;width:clamp(190px,25vw,400px);animation:fly2 31s linear infinite;animation-delay:-14s}
.hw-head .w1{top:30%;width:clamp(180px,26vw,370px);animation:fly 20s linear infinite}
.hw-head .w2{display:none}
@keyframes fly{0%{transform:translate(-100%,30px) rotate(-3deg)}50%{transform:translate(calc(50vw - 50%),-24px) rotate(0)}100%{transform:translate(100vw,24px) rotate(3deg)}}
@keyframes fly2{0%{transform:translate(-100%,-20px) rotate(2deg)}50%{transform:translate(calc(50vw - 50%),30px) rotate(-2deg)}100%{transform:translate(100vw,-10px) rotate(2deg)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}

/* bats */
.bat{position:absolute;z-index:2;left:0;top:var(--y);width:var(--w);color:#0a0414;animation:batfly var(--d) linear infinite;animation-delay:var(--dl)}
.bat svg{display:block;width:100%;height:auto;animation:flap .32s ease-in-out infinite alternate;transform-origin:50% 40%}
@keyframes batfly{0%{transform:translate(-120%,0)}25%{transform:translate(25vw,-30px)}50%{transform:translate(55vw,20px)}75%{transform:translate(80vw,-25px)}100%{transform:translate(110vw,10px)}}
@keyframes flap{to{transform:scaleY(.45)}}

/* fog */
.fog{position:absolute;left:0;bottom:0;width:200%;height:38%;z-index:4;pointer-events:none;filter:blur(8px);
  background:radial-gradient(60% 80% at 50% 75%,rgba(200,175,255,.26),transparent 70%) 0 0/25% 100% repeat-x;animation:drift 50s linear infinite}
.fog.f2{height:28%;opacity:.7;animation-duration:34s;animation-direction:reverse;background-size:20% 100%}
@keyframes drift{to{transform:translateX(-50%)}}

/* ground */
.ground{position:absolute;left:0;right:0;bottom:0;width:100%;height:20%;z-index:3}

/* pumpkins */
.pumpkins{position:absolute;z-index:5;bottom:0}
.hw-full .pumpkins{left:50%;transform:translateX(-50%);width:clamp(300px,50vw,760px);bottom:1vh}
.hw-head .pumpkins{left:2%;width:clamp(150px,24vw,330px)}
.pumpkins img{width:100%;height:auto}
.pg{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:1;translate:-50% -50%;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,215,90,.6),rgba(255,130,30,.2) 45%,transparent 68%);animation:fl var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes fl{0%,100%{opacity:.9;scale:1}18%{opacity:.5;scale:.92}42%{opacity:1;scale:1.1}68%{opacity:.6;scale:.96}}

@media (prefers-reduced-motion:reduce){
  .hw::after{display:none}
  .witch,.witch .bob,.bat,.bat svg,.fog,.star,.pg{animation:none}
  .hw .w1{left:50%;transform:translateX(-50%)}.hw .w2,.bat{display:none}
}
/* ===== end of Halloween CSS ===== */

.bar{position:absolute;z-index:7;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px clamp(12px,3vw,32px);background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);font-family:system-ui,sans-serif}
.bar .brand{font:700 clamp(16px,2.2vw,22px)/1 Georgia,serif;letter-spacing:.04em}
.bar nav{display:flex;gap:clamp(10px,2.2vw,26px);font-size:clamp(12px,1.5vw,15px)}
.bar a{color:#fff;text-decoration:none;opacity:.85}
@media (max-width:520px){.bar a:nth-child(n+3){display:none}}
.greet{position:absolute;z-index:7;left:0;right:0;text-align:center;pointer-events:none;padding:0 12px}
.hw-full .greet{top:10%}.hw-head .greet{bottom:16%}
.greet h2{margin:0;font-size:clamp(28px,7vw,76px);letter-spacing:.03em;color:#ffb347;
  text-shadow:0 0 18px rgba(var(--glow),.8),0 0 42px rgba(190,80,255,.45)}
.hw-head .greet h2{font-size:clamp(24px,5vw,54px)}
.greet p{margin:.3em 0 0;font-size:clamp(14px,2.2vw,24px);color:#e8d5ff;text-shadow:0 0 12px rgba(150,80,255,.7)}
</style>
</head>

  <div class="witch w1"><div class="bob"><img alt="Witch on a broomstick with a black cat" data-img="w1"></div></div>
  <div class="witch w2"><div class="bob"><img alt="" data-img="w2"></div></div>
  <svg class="ground" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path fill="#07030f" d="M0 100V55C120 30 220 62 330 48S560 25 680 50s220 8 320-12V100z"/><g stroke="#07030f" stroke-width="3" fill="none" stroke-linecap="round"><path d="M90 60V18M90 36l-16-14M90 28l14-12M90 44l-12-8"/><path d="M900 52V8M900 30l18-16M900 22l-14-12M900 40l14-10"/></g></svg>
  <div class="fog"></div><div class="fog f2"></div>
  <div class="pumpkins"><img alt="Jack-o-lanterns" data-img="p"><i class="pg" style="--x:26.8%;--y:64.0%;--w:30%;--d:0.80s;--dl:-0.0s"></i><i class="pg" style="--x:55.9%;--y:55.8%;--w:40%;--d:1.07s;--dl:-0.4s"></i><i class="pg" style="--x:80.2%;--y:69.9%;--w:22%;--d:1.34s;--dl:-0.8s"></i></div>

</section>

<div class="label">Halloween – header only</div>
<header class="hw hw-head" id="s2">
  <div class="bar"><span class="brand">YourApp</span><nav><a href="#">Home</a><a href="#">Products</a><a href="#">About</a><a href="#">Contact</a></nav></div>
  <div class="moon"></div>
  <div class="witch w1"><div class="bob"><img alt="Witch on a broomstick" data-img="w2"></div></div>
  <div class="fog"></div>
  <div class="pumpkins"><img alt="Jack-o-lanterns" data-img="p"><i class="pg" style="--x:26.8%;--y:64.0%;--w:30%;--d:0.80s;--dl:-0.0s"></i><i class="pg" style="--x:55.9%;--y:55.8%;--w:40%;--d:1.07s;--dl:-0.4s"></i><i class="pg" style="--x:80.2%;--y:69.9%;--w:22%;--d:1.34s;--dl:-0.8s"></i></div>
  <div class="greet"><h2>Happy Halloween</h2><p>Trick or treat!</p></div>
</header>
