<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santa’s Sleigh – Christmas Template</title>
<style>
/* ===== Santa sleigh CSS (copy this block into your app) ===== */
:root{
  --sky-top:#050b24; --sky-mid:#0e1f4d; --sky-low:#2a3b78;
  --snow:#fff; --glow:255,214,140;
  --fly-time:22s;           /* time to cross the screen */
  --sleigh-width:clamp(360px,62vw,900px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0}
body{background:var(--sky-top);font-family:Georgia,"Times New Roman",serif;color:#fff}

.xmas-scene{
  position:relative;height:100%;min-height:420px;overflow:hidden;
  background:radial-gradient(ellipse at 80% 15%,rgba(255,240,200,.18),transparent 35%),
             linear-gradient(180deg,var(--sky-top),var(--sky-mid) 60%,var(--sky-low));
}
/* stars */
.star{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;
  left:var(--x);top:var(--y);opacity:.3;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes twinkle{50%{opacity:1;transform:scale(1.4)}}
/* moon */
.moon{position:absolute;right:8%;top:8%;width:clamp(50px,9vw,110px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffdf0,#f1e6b8 70%);box-shadow:0 0 60px rgba(255,240,190,.5)}

/* sleigh: outer = flight path, inner = bobbing */
.sleigh-fly{
  position:absolute;left:0;top:28%;width:var(--sleigh-width);
  animation:fly var(--fly-time) linear infinite;will-change:transform;
}
.sleigh-bob{animation:bob 1.6s ease-in-out infinite;transform-origin:30% 60%}
.sleigh-bob img{display:block;width:100%;height:auto;
  filter:drop-shadow(0 0 14px rgba(var(--glow),.35)) drop-shadow(0 10px 18px rgba(0,0,0,.4));
  -webkit-user-drag:none;user-select:none}
@keyframes fly{
  0%  {transform:translate(-100%,50px) rotate(-2deg)}
  50% {transform:translate(calc(50vw - 50%),-40px) rotate(0deg)}
  100%{transform:translate(100vw,40px) rotate(2deg)}
}
@keyframes bob{50%{transform:translateY(-9px) rotate(-.8deg)}}

/* sparkle trail behind the sleigh */
.sleigh-fly::before{
  content:"";position:absolute;right:98%;top:30%;width:60%;height:40%;
  background:radial-gradient(circle,rgba(var(--glow),.55) 0 2px,transparent 3px) 0 0/22px 18px,
             radial-gradient(circle,rgba(255,255,255,.6) 0 1.5px,transparent 2.5px) 9px 9px/26px 20px;
  -webkit-mask:linear-gradient(270deg,#000,transparent);mask:linear-gradient(270deg,#000,transparent);
  animation:trail .8s linear infinite;
}
@keyframes trail{to{background-position:-22px 0,-17px 9px}}

/* snow */
.flake{position:absolute;top:-10px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
  background:var(--snow);opacity:var(--o);animation:fall var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--drift),110vh)}}

/* snowy hills */
.hills{position:absolute;left:0;right:0;bottom:0;height:18%;
  background:radial-gradient(120% 100% at 20% 100%,#eef3ff 0 55%,transparent 56%),
             radial-gradient(120% 100% at 85% 110%,#dfe8ff 0 55%,transparent 56%)}

@media (prefers-reduced-motion:reduce){
  .sleigh-fly{animation:none;left:50%;transform:translateX(-50%)}
  .sleigh-bob,.star,.flake,.sleigh-fly::before{animation:none}
}
/* ===== end of sleigh CSS ===== */

.hero{position:absolute;inset:auto 0 22% 0;text-align:center;padding:0 16px;pointer-events:none}
.hero h1{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:.02em;text-shadow:0 0 24px rgba(var(--glow),.6)}
.hero p{margin:.4em 0 0;opacity:.8;font-size:clamp(14px,2vw,20px)}
</style>
</head>

  for(var i=0;i<70;i++)el('star','--x:'+r()*100+'%;--y:'+r()*60+'%;--s:'+(1+r()*2)+'px;--d:'+(2+r()*3)+'s;--dl:-'+r()*5+'s');
  for(var j=0;j<70;j++)el('flake','--x:'+r()*100+'%;--s:'+(2+r()*5)+'px;--o:'+(.4+r()*.6)+';--d:'+(6+r()*8)+'s;--dl:-'+r()*14+'s;--drift:'+(r()*80-40)+'px');
  s.insertBefore(f,s.firstChild);
})();
</script>
</body>
